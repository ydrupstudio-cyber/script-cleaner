<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>우슬과 용닥터의 대본 정리 프로그램 v3</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Pretendard', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    min-height: 100vh; padding: 20px;
  }
  .container {
    background: white; border-radius: 20px; box-shadow: 0 20px 60px rgba(0,0,0,.3);
    max-width: 1400px; margin: 0 auto; padding: 32px;
  }
  h1 { color: #667eea; text-align: center; font-size: 2em; margin-bottom: 6px; }
  .subtitle { text-align: center; color: #666; margin-bottom: 24px; }
  .options {
    background: #f8f9ff; border-radius: 12px; padding: 16px 20px; margin-bottom: 20px;
    display: flex; flex-wrap: wrap; gap: 10px 24px; align-items: center; font-size: .95em;
  }
  .options label { display: flex; align-items: center; gap: 6px; cursor: pointer; color: #333; }
  .options input[type=text] {
    padding: 6px 10px; border: 1px solid #c7d2fe; border-radius: 6px; width: 260px; font-size: .95em;
  }
  .kw { display: flex; align-items: center; gap: 8px; color: #333; }
  .panes { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
  .pane-head {
    display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;
    font-weight: 600; color: #333;
  }
  .pane-head small { font-weight: 400; color: #888; }
  textarea {
    width: 100%; height: 60vh; min-height: 360px; padding: 16px; border: 2px solid #e5e7eb;
    border-radius: 10px; font-family: inherit; font-size: 1em; line-height: 1.7; resize: vertical;
    background: #f9fafb;
  }
  textarea:focus { outline: none; border-color: #667eea; background: white; }
  #input.dragover { border-color: #764ba2; background: #eef1ff; }
  .button-group { display: flex; gap: 12px; justify-content: center; margin-top: 20px; flex-wrap: wrap; }
  button {
    padding: 13px 30px; border: none; border-radius: 10px; font-size: 1.05em; font-weight: 600;
    cursor: pointer; transition: all .2s; box-shadow: 0 4px 15px rgba(0,0,0,.15); color: white;
  }
  button:hover { transform: translateY(-2px); }
  .btn-file { background: #8b5cf6; }
  .btn-clear { background: #9ca3af; }
  .btn-copy { background: #3b82f6; }
  .btn-download { background: #10b981; }
  .stats { text-align: center; color: #666; margin-top: 14px; font-size: .92em; min-height: 1.2em; }
  details { margin-top: 18px; color: #444; font-size: .9em; }
  details summary { cursor: pointer; color: #667eea; font-weight: 600; }
  #removedList {
    margin-top: 8px; max-height: 240px; overflow: auto; background: #fff7ed; border-radius: 8px;
    padding: 10px 14px; line-height: 1.6; white-space: pre-wrap; color: #9a3412;
  }
  input[type=file] { display: none; }
  .toast {
    position: fixed; bottom: 30px; right: 30px; background: #10b981; color: white;
    padding: 14px 24px; border-radius: 10px; display: none;
  }
  @media (max-width: 900px) {
    .panes { grid-template-columns: 1fr; }
    textarea { height: 40vh; }
    .options input[type=text] { width: 100%; }
  }
</style>
</head>
<body>
<div class="container">
  <h1>📝 우슬과 용닥터의 대본 정리 프로그램 v3</h1>
  <p class="subtitle">노션에서 <b>Ctrl+A → Ctrl+C</b> 한 뒤 왼쪽에 붙여넣으세요. 오른쪽에 읽을 내용만 바로 나옵니다.</p>

  <div class="options">
    <label><input type="checkbox" id="optHeaders" checked> PART 제목(##) 남기기</label>
    <label><input type="checkbox" id="optParaGap"> 문단 사이 빈 줄 1개 남기기</label>
    <label><input type="checkbox" id="optDivider"> 구분선(---) 남기기</label>
    <label><input type="checkbox" id="optSub" checked> [소제목] 남기기</label>
    <label><input type="checkbox" id="optParenLine" checked> 괄호로만 된 줄 지우기</label>
    <span class="kw">연출 메모 키워드
      <input type="text" id="optKeywords" value="캡션, 자막, 화면, 이미지, 사진, 첨부, 촬영, 보여주, 전환, 편집, 메모, B-roll, CG">
    </span>
  </div>

  <div class="panes">
    <div>
      <div class="pane-head">원본 대본 <small>붙여넣기 또는 .txt/.md 파일 끌어다 놓기</small></div>
      <textarea id="input" placeholder="여기에 노션 대본을 붙여넣으세요"></textarea>
    </div>
    <div>
      <div class="pane-head">프롬프터용 <small id="charCount"></small></div>
      <textarea id="output" readonly></textarea>
    </div>
  </div>

  <div class="stats" id="stats"></div>

  <div class="button-group">
    <button class="btn-file" id="fileBtn">파일 열기</button>
    <button class="btn-clear" id="clearBtn">비우기</button>
    <button class="btn-copy" id="copyBtn">복사하기</button>
    <button class="btn-download" id="downloadBtn">txt 다운로드</button>
  </div>
  <input type="file" id="fileInput" accept=".txt,.md">

  <details>
    <summary>지워진 줄 확인하기</summary>
    <div id="removedList">(아직 없음)</div>
  </details>
</div>
<div class="toast" id="toast">클립보드에 복사되었습니다!</div>

<script>
const $ = id => document.getElementById(id);
const input = $('input'), output = $('output');
let fileBase = '';

// 저장된 설정 불러오기 (안 되면 기본값)
const SETTINGS = ['optHeaders', 'optParaGap', 'optDivider', 'optSub', 'optParenLine', 'optKeywords'];
try {
  const saved = JSON.parse(localStorage.getItem('scriptCleanerSettings_v3') || '{}');
  SETTINGS.forEach(k => {
    if (saved[k] === undefined) return;
    if ($(k).type === 'checkbox') $(k).checked = saved[k]; else $(k).value = saved[k];
  });
} catch (e) {}
function saveSettings() {
  try {
    const o = {};
    SETTINGS.forEach(k => o[k] = $(k).type === 'checkbox' ? $(k).checked : $(k).value);
    localStorage.setItem('scriptCleanerSettings_v3', JSON.stringify(o));
  } catch (e) {}
}

const FILE_EXT = 'pdf|jpe?g|png|gif|webp|heic|mp4|mov|m4a|mp3|wav|docx?|xlsx?|pptx?|hwp|zip|csv|txt';
const reBareFile = new RegExp('^\\S.*\\.(' + FILE_EXT + ')$', 'i');   // paik2001.pdf
const reImage    = /!\[[^\]]*\]\([^)]*\)/;                            // ![](...)
const reAttach   = /\[[^\]]*\]\((attachment:|https?:)[^)]*\)/i;       // [x.pdf](attachment:...)
const reUrlOnly  = /^<?https?:\/\/\S+>?$/i;                            // 링크만 있는 줄

function cleanScript(text, opt) {
  const kws = opt.keywords.split(',').map(s => s.trim()).filter(Boolean)
    .map(s => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'));
  // (캡션: ...)  [자막] ...  ※화면: ... 처럼 키워드로 시작하는 메모 줄
  const reNote = kws.length
    ? new RegExp('^[\\(\\[\\{（【<※]?\\s*(' + kws.join('|') + ')\\s*[:：\\]\\)】>]', 'i')
    : null;
  // 문장 안에 붙은 연출 메모: (전후 사진 보여주며) (사진첨부필요) 등 — 키워드가 든 괄호만 삭제
  const reInline = kws.length
    ? new RegExp('\\s*[\\(（][^()（）]*(' + kws.join('|') + ')[^()（）]*[\\)）]\\s*', 'gi')
    : null;

  const out = [], removed = [];
  let pendingGap = false;

  for (let raw of text.replace(/\r\n?/g, '\n').split('\n')) {
    let line = raw.trim();
    const drop = why => removed.push(why + '  ' + raw.trim());

    if (line === '') { pendingGap = out.length > 0; continue; }
    if (/^(※|\/\/)/.test(line))                      { drop('[작업메모]'); continue; }
    if (line.includes('~~'))                         { drop('[삭제표시]'); continue; }
    if (reImage.test(line))                          { drop('[이미지]'); continue; }
    if (reAttach.test(line))                         { drop('[첨부/링크]'); continue; }
    if (line.includes('drive.google.com'))           { drop('[드라이브]'); continue; }
    if (reUrlOnly.test(line))                        { drop('[링크]'); continue; }
    // 🔗 원문: https://...  /  출처: https://...  /  URL 빼면 거의 아무것도 안 남는 줄
    if (/https?:\/\//i.test(line)) {
      const rest = line.replace(/https?:\/\/\S+/gi, '').replace(/[^가-힣a-zA-Z0-9]/g, '');
      if (/^🔗/.test(line) || /^(원문|출처|링크|참고|source|link)\s*[:：]/i.test(line) || rest.length <= 6) {
        drop('[링크]'); continue;
      }
    }
    // 파일명만 있는 줄: 확장자로 끝나고, 띄어쓰기가 없거나 한글 문장이 아닌 경우
    if (reBareFile.test(line) && (!/\s/.test(line) || !/[가-힣]/.test(line))) { drop('[파일명]'); continue; }
    if (reNote && reNote.test(line))                 { drop('[메모]'); continue; }
    // 줄 전체가 괄호 하나로 된 경우: (중국에서 진행된 GT20029 2상. ...) 같은 화면 설명
    if (opt.parenLine && /^[\(（][^()（）]*[\)）]$/.test(line)) { drop('[괄호메모]'); continue; }
    // [추천 제품 & 바르는 횟수] 같은 소제목
    if (!opt.sub && /^\[[^\]]+\]$/.test(line))       { drop('[소제목]'); continue; }
    // 문장 속 연출 메모만 잘라내기
    if (reInline && reInline.test(line)) {
      reInline.lastIndex = 0;
      const cut = line.replace(reInline, ' ').replace(/\s{2,}/g, ' ').trim();
      removed.push('[문장속 메모]  ' + (line.match(reInline) || []).map(s => s.trim()).join(' '));
      if (!cut) continue;
      line = cut;
    }
    reInline && (reInline.lastIndex = 0);

    if (/^-{3,}$|^\*{3,}$/.test(line)) {
      if (!opt.divider) { drop('[구분선]'); continue; }
      line = '---';
    }

    const isHeader = /^#{1,6}\s/.test(line);
    if (isHeader) {
      if (!opt.headers) { drop('[제목]'); continue; }
    }

    // 노션 서식 기호 정리 (**굵게**, `코드`, > 인용, 체크박스)
    line = line
      .replace(/\*\*(.+?)\*\*/g, '$1')
      .replace(/__(.+?)__/g, '$1')
      .replace(/`([^`]+)`/g, '$1')
      .replace(/^>\s?/, '')
      .replace(/^- \[[ xX]\]\s*/, '');

    if (opt.paraGap && pendingGap) out.push('');
    pendingGap = false;
    out.push(line);
  }
  return { text: out.join('\n'), removed };
}

function run() {
  const opt = {
    headers: $('optHeaders').checked,
    paraGap: $('optParaGap').checked,
    divider: $('optDivider').checked,
    sub: $('optSub').checked,
    parenLine: $('optParenLine').checked,
    keywords: $('optKeywords').value
  };
  const src = input.value;
  if (!src.trim()) {
    output.value = ''; $('stats').textContent = ''; $('charCount').textContent = '';
    $('removedList').textContent = '(아직 없음)'; return;
  }
  const r = cleanScript(src, opt);
  output.value = r.text;
  const inLines = src.split('\n').length, outLines = r.text ? r.text.split('\n').length : 0;
  const chars = r.text.replace(/\s/g, '').length;
  $('stats').textContent = `${inLines}줄 → ${outLines}줄 · 첨부·캡션 등 ${r.removed.length}줄 제거`;
  $('charCount').textContent = `공백 제외 ${chars.toLocaleString()}자 · 약 ${Math.max(1, Math.round(chars / 330))}분`;
  $('removedList').textContent = r.removed.length ? r.removed.join('\n') : '(지워진 줄 없음)';
}

input.addEventListener('input', run);
SETTINGS.forEach(k => $(k).addEventListener('input', () => { saveSettings(); run(); }));

// 파일 열기 / 드래그
function loadFile(file) {
  if (!/\.(txt|md)$/i.test(file.name)) { $('stats').textContent = '.txt 또는 .md 파일만 열 수 있어요.'; return; }
  fileBase = file.name.replace(/\.(txt|md)$/i, '');
  const reader = new FileReader();
  reader.onload = e => { input.value = e.target.result; run(); };
  reader.readAsText(file, 'UTF-8');
}
$('fileBtn').onclick = () => $('fileInput').click();
$('fileInput').onchange = e => e.target.files[0] && loadFile(e.target.files[0]);
input.addEventListener('dragover', e => { e.preventDefault(); input.classList.add('dragover'); });
input.addEventListener('dragleave', () => input.classList.remove('dragover'));
input.addEventListener('drop', e => {
  input.classList.remove('dragover');
  if (e.dataTransfer.files.length) { e.preventDefault(); loadFile(e.dataTransfer.files[0]); }
});

$('clearBtn').onclick = () => { input.value = ''; fileBase = ''; run(); input.focus(); };

$('copyBtn').onclick = async () => {
  if (!output.value) return;
  try { await navigator.clipboard.writeText(output.value); }
  catch (e) { output.select(); document.execCommand('copy'); }
  $('toast').style.display = 'block';
  setTimeout(() => $('toast').style.display = 'none', 2000);
};

$('downloadBtn').onclick = () => {
  if (!output.value) return;
  // 파일명: 원본 파일명 → 없으면 첫 PART 제목 대신 날짜
  const d = new Date(), pad = n => String(n).padStart(2, '0');
  const stamp = `${d.getFullYear()}${pad(d.getMonth() + 1)}${pad(d.getDate())}`;
  const name = (fileBase || `대본_${stamp}`) + '_프롬프터.txt';
  const blob = new Blob(['﻿' + output.value], { type: 'text/plain;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(a.href);
};
</script>
</body>
</html>
